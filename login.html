<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | رقميّات ستور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="container">
    <div class="form-wrap">
      <div class="form-card">
        <div style="text-align:center;margin-bottom:26px">
          <div class="logo-mark" style="margin:0 auto 14px;width:54px;height:54px;font-size:26px">◈</div>
          <h2 style="font-size:24px">مرحباً بعودتك 👋</h2>
          <p style="color:var(--muted);font-size:14.5px">سجّل الدخول للوصول إلى حسابك ومشترياتك</p>
        </div>
        <form id="loginForm">
          <div class="form-group"><label>البريد الإلكتروني</label>
            <input type="email" name="email" required placeholder="you@email.com"></div>
          <div class="form-group"><label>كلمة المرور</label>
            <input type="password" name="password" required placeholder="••••••••">
            <div class="err" id="err"></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:14px">
            <label style="display:flex;gap:8px;align-items:center;font-weight:600">
              <input type="checkbox" checked style="width:auto"> تذكّرني</label>
            <a href="faq.html" style="color:var(--brand);font-weight:600">نسيت كلمة المرور؟</a>
          </div>
          <button class="btn btn-primary btn-block">تسجيل الدخول</button>
        </form>
        <div class="divider">أو</div>
        <button class="btn btn-outline btn-block" onclick="toast('الدخول عبر Google غير مفعّل في النسخة التجريبية')">الدخول بواسطة Google</button>
        <p style="text-align:center;margin-top:20px;font-size:14.5px;color:var(--muted)">
          ليس لديك حساب؟ <a href="register.html" style="color:var(--brand);font-weight:700">أنشئ حساباً جديداً</a></p>
      </div>
      <div class="notice info" style="margin-top:20px">
        💡 <b>تجربة سريعة:</b> أنشئ حساباً جديداً من صفحة التسجيل، أو استخدم بيانات أي حساب أنشأته سابقاً على هذا المتصفح.
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if(currentUser()) toast('أنت مسجّل الدخول بالفعل');
  document.getElementById('loginForm').addEventListener('submit', e=>{
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const err = document.getElementById('err');
    try{
      loginUser(f.email.trim().toLowerCase(), f.password);
      toast('تم تسجيل الدخول بنجاح ✓','success');
      setTimeout(()=>location.href='dashboard.html', 700);
    }catch(ex){ err.textContent = ex.message; err.classList.add('show') }
  });
});
</script>
</body>
</html>
