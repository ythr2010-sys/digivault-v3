<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المنتجات الرقمية | الخزنة الرقمية</title>
    <meta name="description" content="تصفح واشترِ أحدث الكتب الإلكترونية، مجسمات 3D/2D، الدورات التعليمية والبطاقات الرقمية بأمان وتسليم فوري.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main:#0a0a12; --bg-card:#141424; --bg-sidebar:#10101c; --accent-cyan:#00d2ff; --accent-purple:#8a2be2; --border-line:rgba(255,255,255,.08); --text-main:#fff; --text-sub:#a0a0c0; --danger-red:#ff4757; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Tajawal',sans-serif; background:var(--bg-main); color:var(--text-main); line-height:1.6; }
        .page-wrapper { display:flex; min-height:100vh; }
        .sidebar { width:260px; background:var(--bg-sidebar); border-left:1px solid var(--border-line); padding:25px 15px; display:flex; flex-direction:column; gap:20px; position:sticky; top:0; height:100vh; z-index:100; }
        .sidebar-menu { list-style:none; display:flex; flex-direction:column; gap:10px; }
        .sidebar-menu li a, .sidebar-menu li button { display:flex; align-items:center; gap:12px; color:var(--text-sub); text-decoration:none; padding:12px 16px; border-radius:10px; font-weight:600; transition:.3s; width:100%; border:none; background:transparent; font-family:inherit; font-size:1rem; cursor:pointer; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background:rgba(0,210,255,.1); color:var(--accent-cyan); border-right:3px solid var(--accent-cyan); }
        .btn-logout-sidebar { color:var(--danger-red)!important; }
        .btn-logout-sidebar:hover { background:rgba(255,71,87,.1)!important; border-right:3px solid var(--danger-red)!important; }
        .main-content { flex:1; padding:30px; overflow-x:hidden; }
        .top-action-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:15px; }
        .btn-upload-direct { background:rgba(0,210,255,.12); color:var(--accent-cyan); border:1px solid var(--accent-cyan); padding:10px 18px; border-radius:10px; text-decoration:none; font-weight:bold; font-size:.9rem; }
        .btn-upload-direct:hover { background:var(--accent-cyan); color:#000; }
        .search-container { margin-bottom:20px; }
        .search-input { width:100%; padding:14px 18px; background:var(--bg-card); border:1px solid var(--border-line); border-radius:10px; color:#fff; font-family:inherit; font-size:1rem; outline:none; }
        .search-input:focus { border-color:var(--accent-cyan); }
        .filter-container { display:flex; gap:12px; margin-bottom:30px; flex-wrap:wrap; }
        .filter-btn { background:var(--bg-card); border:1px solid var(--border-line); color:var(--text-sub); padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:700; font-family:inherit; }
        .filter-btn.active, .filter-btn:hover { background:var(--accent-cyan); color:#000; border-color:var(--accent-cyan); }
        .products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:25px; }
        .product-card { background:var(--bg-card); border:1px solid var(--border-line); border-radius:14px; padding:15px; display:flex; flex-direction:column; justify-content:space-between; transition:.3s; text-decoration:none; color:inherit; }
        .product-card:hover { border-color:var(--accent-cyan); transform:translateY(-5px); box-shadow:0 8px 20px rgba(0,0,0,.5); }
        .product-image-container { width:100%; height:160px; overflow:hidden; border-radius:8px; margin-bottom:12px; background:#1e1e24; }
        .product-image-container img { width:100%; height:100%; object-fit:cover; }
        .product-badge { align-self:flex-start; background:rgba(138,43,226,.2); color:#c084fc; padding:4px 10px; border-radius:6px; font-size:.75rem; font-weight:bold; margin-bottom:8px; display:inline-block; }
        .product-title { font-size:1.1rem; font-weight:800; margin-bottom:8px; }
        .product-desc { font-size:.85rem; color:var(--text-sub); margin-bottom:15px; height:40px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .product-footer { display:flex; justify-content:space-between; align-items:center; margin-top:auto; border-top:1px solid var(--border-line); padding-top:12px; }
        .product-price { font-size:1.2rem; font-weight:900; color:#10b981; }
        .btn-add { background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple)); color:#fff; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:bold; font-family:inherit; }
        .btn-add:hover { opacity:.9; }
        .toast-notification { position:fixed; bottom:20px; left:20px; background:var(--accent-cyan); color:#000; padding:12px 20px; border-radius:8px; font-weight:bold; display:none; z-index:3000; }
        @media (max-width:768px){ .page-wrapper{flex-direction:column} .sidebar{width:100%;height:auto;position:static} }
    </style>

</head>
<body>
    <div class="page-wrapper">
        <aside class="sidebar">
            <div class="logo"><a href="index.html" style="font-size:1.5rem;font-weight:900;color:#fff;text-decoration:none;">الخزنة<span style="color:var(--accent-cyan);">الرقمية</span></a></div>
            <ul class="sidebar-menu">
                <li><a href="index.html">🏠 الصفحة الرئيسية</a></li>
                <li><a href="shop.html" class="active">🛍️ تسوق الآن (المنتجات)</a></li>
                <li><a href="cart.html">🛒 سلة المشتريات (<span id="cartBadgeCount">0</span>)</a></li>
                <li><a href="profile.html">📦 مشترياتي</a></li>
                <li><a href="contact.html">📩 تواصل معنا والأسئلة</a></li>
                <li><a href="add-product.html">➕ أضف منتجك للبيع</a></li>
                <li id="loginMenuLi"><a href="login.html">🔑 تسجيل الدخول</a></li>
                <li id="logoutMenuLi" style="display:none;"><button onclick="logoutUser()" class="btn-logout-sidebar">🚪 تسجيل الخروج</button></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-action-bar">
                <h1 style="font-size:1.8rem;">كتالوج المنتجات الرقمية 📦</h1>
                <a href="add-product.html" class="btn-upload-direct">➕ إرسال منتج جديد</a>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن كتاب، مجسم 3D، أو دورة تعليمية..." oninput="handleFilterAndSearch()">
            </div>

            <div class="filter-container">
                <button class="filter-btn active" data-cat="all" onclick="filterCategory('all', event)">الكل</button>
                <button class="filter-btn" data-cat="books" onclick="filterCategory('books', event)">📚 كتب وروايات</button>
                <button class="filter-btn" data-cat="models" onclick="filterCategory('models', event)">🎨 مجسمات 3D/2D</button>
                <button class="filter-btn" data-cat="courses" onclick="filterCategory('courses', event)">🎓 دورات فيديو</button>
                <button class="filter-btn" data-cat="gaming" onclick="filterCategory('gaming', event)">🎮 ألعاب واشتراكات</button>
            </div>

            <div class="products-grid" id="productsGrid">
                <p style="color:var(--text-sub);grid-column:1/-1;text-align:center;padding:40px;">جاري تحميل المنتجات...</p>
            </div>
        </main>
    </div>

    <div id="toast" class="toast-notification"></div>

    <script type="module">
        import { auth, db, getCart, saveCart, esc } from "./firebase-init.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentCategory = 'all';
        let allProductsCache = [];

        function updateCartBadge() {
            document.getElementById("cartBadgeCount").textContent = getCart().length;
        }

        onAuthStateChanged(auth, (user) => {
            const loginLi = document.getElementById("loginMenuLi");
            const logoutLi = document.getElementById("logoutMenuLi");
            if (user) {
                if (loginLi) loginLi.style.display = "none";
                if (logoutLi) logoutLi.style.display = "block";
            } else {
                if (loginLi) loginLi.style.display = "block";
                if (logoutLi) logoutLi.style.display = "none";
            }
        });

        async function fetchApprovedProducts() {
            try {
                // ✅ المنتجات المعتمدة فقط - وبدون رابط التحميل
                const q = query(collection(db, "products"), where("status", "==", "approved"));
                const snap = await getDocs(q);
                const list = [];
                snap.forEach(d => {
                    const data = d.data();
                    list.push({
                        id: d.id,
                        title: data.title || "منتج بدون عنوان",
                        cat: data.category || "books",
                        badge: data.badge || 'منتج رقمي',
                        desc: data.description || "لا يوجد وصف.",
                        price: data.price || "مجاني",
                        imgUrl: data.imageUrl || "https://via.placeholder.com/300x160?text=DigiVault"
                    });
                });
                allProductsCache = list;
            } catch (error) {
                console.error("خطأ أثناء جلب المنتجات:", error);
            }
            handleFilterAndSearch();
        }

        // ✅ esc() تمنع حقن XSS من عناوين المنتجات
        window.renderProducts = function(items) {
            const grid = document.getElementById("productsGrid");
            if (items.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-sub);grid-column:1/-1;text-align:center;padding:40px;">لا توجد منتجات معتمدة حالياً.</p>`;
                return;
            }
            grid.innerHTML = items.map(p => {
                const priceFormatted = String(p.price).includes('$') || p.price === 'مجاني' ? p.price : '$' + p.price;
                return `
                    <a href="product.html?id=${encodeURIComponent(p.id)}" class="product-card">
                        <div>
                            <div class="product-image-container">
                                <img src="${esc(p.imgUrl)}" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x160?text=DigiVault'" alt="${esc(p.title)}">
                            </div>
                            <span class="product-badge">${esc(p.badge)}</span>
                            <h3 class="product-title">${esc(p.title)}</h3>
                            <p class="product-desc">${esc(p.desc)}</p>
                        </div>
                        <div class="product-footer">
                            <span class="product-price">${esc(priceFormatted)}</span>
                            <button type="button" class="btn-add" data-id="${esc(p.id)}" data-title="${esc(p.title)}" data-price="${esc(p.price)}">إضافة للسلة 🛒</button>
                        </div>
                    </a>
                `;
            }).join('');

            // ربط الأزرار بأمان بدون inline onclick
            grid.querySelectorAll('.btn-add').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    window.addToCart(btn.dataset.id, btn.dataset.title, btn.dataset.price);
                });
            });
        };

        window.handleFilterAndSearch = function() {
            const queryText = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
            const filtered = allProductsCache.filter(p => {
                const matchesCat = (currentCategory === 'all' || p.cat === currentCategory);
                const matchesSearch = (p.title || "").toLowerCase().includes(queryText) || (p.desc || "").toLowerCase().includes(queryText);
                return matchesCat && matchesSearch;
            });
            window.renderProducts(filtered);
        };

        window.filterCategory = function(cat, evt) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            const target = evt?.target || document.querySelector(`.filter-btn[data-cat="${cat}"]`);
            if (target) target.classList.add('active');
            window.handleFilterAndSearch();
        };

        window.showToast = function(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2500);
        };

        // ✅ مفتاح السلة الموحد + بدون أي رابط تحميل
        window.addToCart = function(id, title, price) {
            const cart = getCart();
            cart.push({ id, title, price });
            saveCart(cart);
            updateCartBadge();
            window.showToast(`تمت إضافة "${title}" إلى السلة 🛒`);
        };

        window.logoutUser = async function() {
            await signOut(auth);
            window.location.href = "index.html";
        };

        document.addEventListener("DOMContentLoaded", () => {
            fetchApprovedProducts();
            updateCartBadge();
            const categoryParam = new URLSearchParams(window.location.search).get('cat');
            if (categoryParam) window.filterCategory(categoryParam);
        });
    </script>
    <script type="module" src="./site-enhance.js"></script>
</body>
</html>
